name: Website export
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Verify static export
        run: |
          test -s dist/client/index.html
          test -s dist/client/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: constellation-website
          path: dist/client/
          include-hidden-files: true
          if-no-files-found: error
